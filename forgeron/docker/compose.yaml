# Run forgeron in a container, locally.
#
# NOT TESTED: neither docker nor kubectl on the machine this file was written on.
#
# Run:      docker compose -f docker/compose.yaml run --rm forgeron doctor
# The loop: docker compose -f docker/compose.yaml up -d
services:
  forgeron:
    build:
      context: ../..
      dockerfile: forgeron/docker/Dockerfile
    image: forgeron:0.1.0

    # The subscription token and the GitHub token, from a file in 600. NEVER in
    # `environment:` here: this file is versioned.
    env_file:
      - ${HOME}/.forgeron/secrets.env

    environment:
      GIT_AUTHOR_NAME: forgeron
      GIT_AUTHOR_EMAIL: forgeron@localhost.invalid

    volumes:
      # the driver's state: it is the only thing that must outlive the container
      - ${HOME}/.forgeron:/home/forgeron/.forgeron
      # the clone the worktrees are taken from. Read-write: a worktree
      # writes into the clone's .git, so a ro mount would break `worktree add`.
      - ${HOME}/forgeron-sandbox:/repos/forgeron-sandbox

    command: ["run", "--write", "--interval", "60",
              "--config", "/home/forgeron/.forgeron/config.json"]
    restart: unless-stopped

    # An agent that compiles can eat the machine. Bounds, even generous ones,
    # are better than an OOM killer choosing for you what dies.
    cpus: 4.0
    mem_limit: 8g
