# THE SHAPE of a Secret, not a Secret. Do NOT fill in this file: it is versioned.
#
# `stringData` is not encrypted - Kubernetes stores it in base64, which is not
# encryption. A Secret protects from accidental reading and through RBAC
# permissions, never from someone who has access to the repository.
#
# The right way, without any secret touching the disk in clear text or git:
#
#   kubectl create secret generic forgeron -n forgeron \
#     --from-env-file="$HOME/.forgeron/secrets.env"
#
# The file must contain exactly, one line each:
#   CLAUDE_CODE_OAUTH_TOKEN=...   (from `claude setup-token`, on your subscription)
#   GH_TOKEN=...                  (`gh auth token`, or an App installation token)
#
# Check WITHOUT printing the values:
#   kubectl get secret forgeron -n forgeron -o jsonpath='{.data}' | tr ',' '\n' | cut -d'"' -f2
apiVersion: v1
kind: Secret
metadata:
  name: forgeron
  namespace: forgeron
type: Opaque
stringData:
  CLAUDE_CODE_OAUTH_TOKEN: "REPLACE-ME-BUT-NOT-HERE"
  GH_TOKEN: "REPLACE-ME-BUT-NOT-HERE"
