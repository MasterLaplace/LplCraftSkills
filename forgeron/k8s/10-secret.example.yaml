# LA FORME d'un Secret, pas un Secret. Ne remplis PAS ce fichier : il est versionne.
#
# `stringData` n'est pas chiffre - Kubernetes le stocke en base64, ce qui n'est pas
# du chiffrement. Un Secret protege de la lecture accidentelle et des permissions
# RBAC, jamais de quelqu'un qui a acces au depot.
#
# La bonne facon, sans qu'aucun secret ne touche le disque en clair ni git :
#
#   kubectl create secret generic forgeron -n forgeron \
#     --from-env-file="$HOME/.forgeron/secrets.env"
#
# Le fichier doit contenir exactement, une ligne chacun :
#   CLAUDE_CODE_OAUTH_TOKEN=...   (issu de `claude setup-token`, sur ton abonnement)
#   GH_TOKEN=...                  (`gh auth token`, ou un jeton d'installation d'App)
#
# Verifier SANS afficher les valeurs :
#   kubectl get secret forgeron -n forgeron -o jsonpath='{.data}' | tr ',' '\n' | cut -d'"' -f2
apiVersion: v1
kind: Secret
metadata:
  name: forgeron
  namespace: forgeron
type: Opaque
stringData:
  CLAUDE_CODE_OAUTH_TOKEN: "REMPLACE-MOI-MAIS-PAS-ICI"
  GH_TOKEN: "REMPLACE-MOI-MAIS-PAS-ICI"
