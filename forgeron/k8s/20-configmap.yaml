# The driver's configuration, mounted as a file. A ConfigMap and not a Secret:
# nothing in there is sensitive, and mixing them would mean rereading a Secret every
# time one wants to change an interval.
#
# WARNING: a repository's `path` is the one SEEN FROM THE POD, not from the host.
# It is the first thing that breaks when a local config is copied as it is.
apiVersion: v1
kind: ConfigMap
metadata:
  name: forgeron-config
  namespace: forgeron
data:
  config.json: |
    {
      "home": "/var/lib/forgeron",
      "repos": [
        {
          "slug": "MasterLaplace/forgeron-sandbox",
          "path": "/repos/forgeron-sandbox",
          "base": "main",
          "labels": ["forgeron"],
          "hold_label": "forgeron:hold",
          "reviewers": ["MasterLaplace"]
        }
      ],
      "limits": {
        "max_rounds": 6,
        "max_spend_usd": 12.0,
        "auto_merge": false,
        "checks_timeout_minutes": 45,
        "max_check_fixes": 3
      },
      "max_concurrent": 1,
      "poll_seconds": 60,
      "model": "sonnet",
      "budget_per_run_usd": 3.0,
      "continuity": "rebuild",
      "agent": "artisan"
    }
