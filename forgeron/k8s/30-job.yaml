# ONE forgeron action, once. A Job and not a Deployment: an action is
# bounded (one agent run), whereas an issue lives for days - the Deployment, if there
# is ever one, is the reconciler that decides, not the one that executes.
#
# NOT TESTED: neither docker nor kubectl on the machine this file was written on.
#
# Before applying, TWO things that are not obvious:
#
# 1. the local image does not exist for the cluster. k3d nodes are containers
#    with their own image storage, so an image built on the host is
#    invisible to them. It has to be pushed there:
#        k3d image import forgeron:0.1.0 -c forgeron
#    Without that: the pod stays in ErrImagePull, which looks like a network
#    problem and is not one.
#
# 2. `continuity: "rebuild"` in the ConfigMap, and it is not a detail: a
#    claude session is filed under a slug of the working directory, so a pod
#    cannot resume a conversation created elsewhere. See docs/CLUSTER.md.
apiVersion: batch/v1
kind: Job
metadata:
  name: forgeron-une-passe
  namespace: forgeron
spec:
  backoffLimit: 1              # an idempotent action is resumed, it is not replayed six times
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: forgeron
          image: forgeron:0.1.0
          imagePullPolicy: IfNotPresent   # otherwise it will look for the image on a remote registry
          args: ["once", "--write", "--config", "/etc/forgeron/config.json"]
          envFrom:
            - secretRef:
                name: forgeron           # CLAUDE_CODE_OAUTH_TOKEN and GH_TOKEN
          resources:
            requests: { cpu: "500m", memory: "1Gi" }
            limits:   { cpu: "4",    memory: "8Gi" }
          volumeMounts:
            - { name: config, mountPath: /etc/forgeron, readOnly: true }
            - { name: state,  mountPath: /var/lib/forgeron }
            - { name: repos,  mountPath: /repos }
      volumes:
        - name: config
          configMap: { name: forgeron-config }
        # emptyDir: the state dies with the pod. Enough for a first try with
        # `once`, NOT for the loop - it would need a PersistentVolumeClaim, otherwise
        # every pass rediscovers the issues from scratch and replans everything.
        - name: state
          emptyDir: {}
        - name: repos
          emptyDir: {}
